name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push straight to main can race an in-flight run from the commit before
# it; a PR gets updated with new commits often enough that finishing a stale
# run wastes minutes for no signal. Cancel either in favor of the newer one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # DATABASE_URL etc. are unset here on purpose: conftest.py points the
      # suite at an in-memory SQLite database before any app module that
      # would otherwise reach for a real Postgres/Redis is imported.
      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (vitest, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
