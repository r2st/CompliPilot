[project]
name = "complipilot-backend"
version = "0.1.0"
description = "CompliPilot — AI compliance copilot for Indian SMBs and CA firms (FastAPI backend)"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt, which is what the
# deployment installs. Kept there rather than duplicated here so there is one
# place to change them.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The brief asks for >80%. Set as a gate just under where the suite sits, so
# that deleting tests or adding an untested module fails CI.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by `alembic revision --autogenerate`; reformatting
# them by hand means the next autogenerate reintroduces every finding.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # `x: Type = Depends(...)` is the FastAPI idiom for dependency injection —
    # the whole API surface would need noqa without this.
    "B008",
    # `class X(str, Enum)` is deliberate: members must compare equal to their
    # stored string for SQLAlchemy's non-native Enum columns and for Pydantic
    # serialization. StrEnum is not a drop-in replacement here.
    "UP042",
]
