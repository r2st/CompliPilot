[alembic]
script_location = alembic
prepend_sys_path = .
# Version files are named with a UTC date prefix so `ls` sorts them in the
# order they were written. The revision graph is still what alembic follows;
# this is purely so a human can read the directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# sqlalchemy.url is deliberately absent. alembic/env.py reads DATABASE_URL
# through app.core.config, so migrations and the application can never point
# at different databases.

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a compiled binary and
# registers no console_scripts entry point, so the entrypoint hook type cannot
# find it.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
